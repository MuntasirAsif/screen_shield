name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dart:
    name: Analyze & test (Dart)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android build & native unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Resolve example dependencies
        working-directory: example
        run: flutter pub get
      - name: Build example APK (compiles plugin Kotlin)
        working-directory: example
        run: flutter build apk --debug
      - name: Plugin native unit tests
        working-directory: example/android
        run: ./gradlew :screen_shield:testDebugUnitTest

  ios:
    name: iOS build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Resolve example dependencies
        working-directory: example
        run: flutter pub get
      - name: Build example (no codesign)
        working-directory: example
        run: flutter build ios --debug --no-codesign
